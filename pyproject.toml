[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nod-backchannel"
version = "0.10.1"
description = "Event-driven listener feedback runtime"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "websockets>=14,<18", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
audio = ["faster-whisper>=1.2,<2", "sounddevice>=0.5,<1", "maai>=0.2,<0.3"]
fast-asr = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8"]

[project.scripts]
nod = "nod.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nod = ["resources/*.json", "resources/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
